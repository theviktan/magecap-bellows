name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Jobs read the repository only; the release job alone may write, and only for a version tag.
# Actions are pinned to full commits (their version in the comment), so a moved tag can't change what runs.
permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC, all tests on lavapipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          submodules: recursive

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools libvulkan-dev mesa-vulkan-drivers \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: cmake --preset linux-debug -DPython_ROOT_DIR="$pythonLocation"

      - name: Build
        run: cmake --build build/linux-debug

      - name: Test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: ctest --test-dir build/linux-debug --output-on-failure

  windows:
    name: Windows (MSVC, build and unit tests)
    runs-on: windows-2022
    outputs:
      package_name: ${{ steps.zip.outputs.package_name }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          submodules: recursive

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8  # v1
        with:
          vulkan_version: 1.4.363.1
          install_runtime: true
          cache: true
          stripdown: true

      # A version tag builds the release itself, which reports its plain version (others say "-dev").
      - name: Configure
        run: |
          $release = @()
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $release += '-DBELLOWS_RELEASE_BUILD=ON' }
          cmake --preset windows -DPython_ROOT_DIR="$env:pythonLocation" $release

      # Compiler errors and warnings are also reported as annotations on the workflow run.
      - name: Build
        run: |
          cmake --build build/windows --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': (fatal )?error |: warning C' |
              Select-Object -ExpandProperty Line -Unique | Select-Object -First 40 |
              ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - name: List runtime files
        run: Get-ChildItem build/windows/bin -Filter *.dll | Select-Object Name, Length

      # Hosted Windows runners have no Vulkan driver, so only the GPU-free suites run here.
      - name: Test
        run: ctest --test-dir build/windows -C Release -R "BellowsUnitTests|ForgeScript" --output-on-failure

      # A ready-to-run editor: engine, sample project, bundled Python and the C++ runtime DLLs.
      - name: Package
        run: |
          $redist = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $redist) { Write-Output "::error::Visual C++ runtime DLLs not found"; exit 1 }
          # Builds between releases carry their commit in the name (MageCap-Bellows-0.3.0-3f8b735-Windows);
          # a version tag makes the release package (MageCap-Bellows-0.3.0-Windows).
          $naming = @()
          if ($env:GITHUB_REF -notlike 'refs/tags/v*') { $naming += '--name-with-commit' }
          python Tools/PackageRelease.py --build-dir build/windows --output dist --msvc-redist $redist.FullName --no-zip $naming
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The unit tests run from inside the package, so its bundled Python is the one in use.
      - name: Test the package
        run: |
          $package = Get-ChildItem dist -Directory | Select-Object -First 1
          Copy-Item build/windows/bin/BellowsTests.exe $package.FullName
          Push-Location $package.FullName
          .\BellowsTests.exe "--test-case-exclude=*[gpu]*"
          $code = $LASTEXITCODE
          Pop-Location
          Remove-Item (Join-Path $package.FullName "BellowsTests.exe"), (Join-Path $package.FullName "*.log") -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $package.FullName "TestOutput") -Recurse -ErrorAction SilentlyContinue
          exit $code

      - name: Zip the package
        id: zip
        run: |
          $package = Get-ChildItem dist -Directory | Select-Object -First 1
          7z a -tzip "dist/$($package.Name).zip" "./dist/$($package.Name)" -mx=7 | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "PACKAGE_NAME=$($package.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "package_name=$($package.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The setup program (Tools/Installer/MageCapBellows.iss): a per-user install the editor can update.
      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s+VERSION\s+([0-9.]+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$PWD\dist\$env:PACKAGE_NAME" "/DOutputDir=$PWD\dist" "/DOutputName=$env:PACKAGE_NAME-Setup" Tools\Installer\MageCapBellows.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "ENGINE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Installs silently into a scratch folder (no shortcuts on the desktop, no file association, the
      # editor left closed), checks the installed programs run, then uninstalls.
      - name: Test the installer
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "BellowsInstall"
          $setup = Start-Process "dist\$env:PACKAGE_NAME-Setup.exe" -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/NOLAUNCH", "/TASKS=""""", "/DIR=""$dir""", "/LOG=""$env:RUNNER_TEMP\setup.log""")
          if ($setup.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; Write-Output "::error::Setup failed ($($setup.ExitCode))"; exit 1 }
          foreach ($file in "BellowsEditor.exe", "BellowsRuntime.exe", "forgescript.exe", "unins000.exe", "Projects\FeatureTest\FeatureTest.bproject") {
            if (-not (Test-Path (Join-Path $dir $file))) { Write-Output "::error::The install has no $file"; exit 1 }
          }
          $forge = Start-Process (Join-Path $dir "forgescript.exe") -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          if ($forge.ExitCode -ne 0) { Write-Output "::error::The installed forgescript doesn't run"; exit 1 }
          Start-Process (Join-Path $dir "unins000.exe") -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          # The uninstaller finishes from a copy of itself, so give it a moment.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir "BellowsEditor.exe")); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path (Join-Path $dir "BellowsEditor.exe")) { Write-Output "::error::Uninstalling left the editor behind"; exit 1 }

      # What the editor's update check reads (Tools/WriteUpdateManifest.py), served by the update server.
      - name: Write update.json
        run: |
          python Tools/WriteUpdateManifest.py --version $env:ENGINE_VERSION --installer "dist/$env:PACKAGE_NAME-Setup.exe" --portable "dist/$env:PACKAGE_NAME.zip" --notes "docs/ReleaseNotes/$env:ENGINE_VERSION.md" --output dist/update.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ env.PACKAGE_NAME }}-Setup
          path: |
            dist/${{ env.PACKAGE_NAME }}-Setup.exe
            dist/update.json
          retention-days: 30

      - name: Upload the editor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: dist/${{ env.PACKAGE_NAME }}
          retention-days: 30

      # A tag must match the engine version, or the release would be named for another version.
      - name: Check the tag
        id: tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s+VERSION\s+([0-9.]+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { Write-Output "::error::Tag $env:GITHUB_REF_NAME does not match the engine version $version"; exit 1 }
          if (-not (Test-Path "docs/ReleaseNotes/$version.md")) { Write-Output "::error::docs/ReleaseNotes/$version.md is missing"; exit 1 }
          # The notes become the release text, so the line kept in them while the work lands must be gone.
          if (Select-String -Path "docs/ReleaseNotes/$version.md" -SimpleMatch -Quiet "These notes grow") { Write-Output "::error::docs/ReleaseNotes/$version.md still says 'These notes grow'; remove that line before the release"; exit 1 }
          if (Select-String -Path ForgeScript/CHANGELOG.md -SimpleMatch -Quiet "(not released yet)") { Write-Output "::error::ForgeScript/CHANGELOG.md still has a version '(not released yet)'; date it before the release"; exit 1 }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The zip, the setup program and update.json, for the release job.
      - name: Upload the release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-files
          path: |
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.PACKAGE_NAME }}-Setup.exe
            dist/update.json
          retention-days: 1

  # Publishing is its own job, the only one that can write to the repository.
  release:
    name: Publish the release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write    # Creating or updating the GitHub Release
      actions: read      # Downloading the files the Windows job made
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-files --dir dist

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            dist/${{ needs.windows.outputs.package_name }}.zip
            dist/${{ needs.windows.outputs.package_name }}-Setup.exe
            dist/update.json
          body_path: docs/ReleaseNotes/${{ needs.windows.outputs.version }}.md
          generate_release_notes: true
