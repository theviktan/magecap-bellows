name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (GCC, all tests on lavapipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools libvulkan-dev mesa-vulkan-drivers \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: cmake --preset linux-debug -DPython_ROOT_DIR="$pythonLocation"

      - name: Build
        run: cmake --build build/linux-debug

      - name: Test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: ctest --test-dir build/linux-debug --output-on-failure

  windows:
    name: Windows (MSVC, build and unit tests)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true

      - name: Configure
        run: cmake --preset windows -DPython_ROOT_DIR="$env:pythonLocation"

      # Compiler errors and warnings are also reported as annotations on the workflow run.
      - name: Build
        run: |
          cmake --build build/windows --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': (fatal )?error |: warning C' |
              Select-Object -ExpandProperty Line -Unique | Select-Object -First 40 |
              ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - name: List runtime files
        run: Get-ChildItem build/windows/bin -Filter *.dll | Select-Object Name, Length

      # Hosted Windows runners have no Vulkan driver, so only the GPU-free suites run here.
      - name: Test
        run: ctest --test-dir build/windows -C Release -R "BellowsUnitTests|ForgeScript" --output-on-failure
