<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The MageCap Bellows app icon: a medieval bellows blowing on a flame. It follows MageCap Forge's
       icon (same tile, flat off-white tool, flat accent in a dark ring) so the two read as a family.
       Edit this file, then run Tools/GenerateAppIcon.py to rebuild Bellows.png and Bellows.ico. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2E53"/>
      <stop offset="1" stop-color="#16182A"/>
    </linearGradient>
    <path id="board" d="M0 -64 C14 -60 50 -24 48 10 C47 38 30 52 0 52 C-30 52 -47 38 -48 10 C-50 -24 -14 -60 0 -64 Z"/>
    <!-- The leather shows below the board as a pleated band, cut apart from it by a gap. -->
    <mask id="leatherCut" maskUnits="userSpaceOnUse" x="-200" y="-200" width="400" height="400">
      <rect x="-200" y="-200" width="400" height="400" fill="#fff"/>
      <use href="#board" fill="#000" stroke="#000" stroke-width="16"/>
      <g stroke="#000" stroke-width="7">
        <path d="M-54 -2 l-26 10"/><path d="M-53 16 l-26 8"/><path d="M-48 33 l-24 12"/>
        <path d="M-37 48 l-20 18"/><path d="M-20 57 l-12 22"/><path d="M0 60 l-2 24"/>
        <path d="M20 57 l8 22"/><path d="M37 48 l18 18"/>
      </g>
    </mask>
  </defs>
  <rect x="22.25" y="22.25" width="467.5" height="467.5" rx="103.25" fill="url(#tile)" stroke="#4E5486" stroke-width="5.5"/>

  <!-- Accent: the flame, in a ring of the tile's dark like Forge's check -->
  <g transform="translate(356.56 165.72) scale(1.02)">
    <path id="flame" d="M0 -78 C18 -54 46 -36 44 -2 C42 26 22 40 0 40 C-22 40 -42 26 -44 0 C-46 -26 -26 -36 -20 -56 C-14 -42 -8 -38 -4 -46 C0 -56 -4 -66 0 -78 Z"
          fill="none" stroke="#1B1E34" stroke-width="17.65" stroke-linejoin="round"/>
    <path d="M0 -78 C18 -54 46 -36 44 -2 C42 26 22 40 0 40 C-22 40 -42 26 -44 0 C-46 -26 -26 -36 -20 -56 C-14 -42 -8 -38 -4 -46 C0 -56 -4 -66 0 -78 Z" fill="#F5873A"/>
    <path d="M0 -26 C10 -14 22 -4 20 12 C19 26 10 34 0 34 C-11 34 -19 26 -20 14 C-21 0 -9 -6 0 -26 Z" fill="#FFC94D"/>
  </g>

  <!-- Tool: the bellows, one flat silhouette, nozzle toward the flame -->
  <g fill="#F0F2FA" transform="translate(215 315) rotate(52) scale(1.2)">
    <g mask="url(#leatherCut)">
      <g transform="translate(-10 16) scale(1.04)"><use href="#board"/></g>
      <!-- The back board's handle, spread from the front one -->
      <polygon points="-11,48 11,48 11,100 -11,100" transform="rotate(24 0 30)"/>
    </g>
    <use href="#board"/>
    <polygon points="-11,48 11,48 11,98 -11,98"/>
    <polygon points="-17,-70 17,-70 17,-56 -17,-56"/>
    <polygon points="-10,-70 10,-70 5,-116 -5,-116"/>
  </g>
</svg>
