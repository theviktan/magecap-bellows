<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The MageCap Bellows app icon: a medieval bellows blowing on a flame. It follows MageCap Forge's
       icon (same tile, flat off-white tool, flat accent in a dark ring) so the two read as a family.
       Edit this file, then run Tools/GenerateAppIcon.py to rebuild Bellows.png and Bellows.ico. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2E53"/>
      <stop offset="1" stop-color="#16182A"/>
    </linearGradient>
    <path id="board" d="M0 -74 C22 -54 47 -24 47 4 C47 29 26 46 0 46 C-26 46 -47 29 -47 4 C-47 -24 -22 -54 0 -74 Z"/>
    <!-- The leather: a zigzag band along one long edge of the board, cut from it by one gap. -->
    <mask id="leatherCut" maskUnits="userSpaceOnUse" x="-200" y="-200" width="400" height="400">
      <rect x="-200" y="-200" width="400" height="400" fill="#fff"/>
      <use href="#board" fill="#000" stroke="#000" stroke-width="14"/>
    </mask>
  </defs>
  <rect x="22.25" y="22.25" width="467.5" height="467.5" rx="103.25" fill="url(#tile)" stroke="#4E5486" stroke-width="5.5"/>

  <!-- Accent: the flame, in a ring of the tile's dark like Forge's check -->
  <g transform="translate(346 170) scale(1.22)">
    <path d="M 0 -68.6 C 18 -47.5 46 -31.7 44 -1.8 C 42 22.9 22 35.2 0 35.2 C -22 35.2 -42 22.9 -44 0 C -46 -22.9 -26 -31.7 -20 -49.3 C -14 -37 -8 -33.4 -4 -40.5 C 0 -49.3 -4 -58.1 0 -68.6 Z" fill="none" stroke="#1B1E34" stroke-width="14.75" stroke-linejoin="round"/>
    <path d="M 0 -68.6 C 18 -47.5 46 -31.7 44 -1.8 C 42 22.9 22 35.2 0 35.2 C -22 35.2 -42 22.9 -44 0 C -46 -22.9 -26 -31.7 -20 -49.3 C -14 -37 -8 -33.4 -4 -40.5 C 0 -49.3 -4 -58.1 0 -68.6 Z" fill="#F5873A"/>
    <path d="M 0 -21.1 C 10 -10.6 22 -1.8 20 11.4 C 19 23.8 10 29.9 0 29.9 C -11 29.9 -19 23.8 -20 13.2 C -21 0.9 -9 -4.4 0 -21.1 Z" fill="#FFC94D"/>
  </g>

  <!-- Tool: the bellows, one flat silhouette, nozzle toward the flame -->
  <g fill="#F0F2FA" transform="translate(203.9 308.5) rotate(56) scale(1.3)">
    <polygon mask="url(#leatherCut)" points="6,-66 34,-54 40,-40 56,-32 52,-16 67,-6 57,9 67,22 52,31 48,48 0,44 0,-60"/>
    <use href="#board"/>
    <!-- Two long straight handles out of the back, one per board, spread apart -->
    <polygon points="-18,40 -3,40 -3,84 -18,84" transform="rotate(11 -10 40)"/>
    <polygon points="3,40 18,40 18,84 3,84" transform="rotate(-11 10 40)"/>
    <polygon points="-15,-82 15,-82 15,-68 -15,-68"/>
    <polygon points="-11,-79 11,-79 5,-112 -5,-112"/>
  </g>
</svg>
